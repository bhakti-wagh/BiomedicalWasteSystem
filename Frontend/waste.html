<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Waste Management</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="layout">

        <!-- Sidebar -->

        <aside class="sidebar">

            <h2>BioWaste</h2>

            <nav>

                <a href="dashboard.html">
                    Dashboard
                </a>

                <a href="waste.html" class="active">
                    Waste Management
                </a>

                <a href="#">
                    Bins
                </a>

                <a href="#">
                    Collections
                </a>

                <a href="#">
                    Alerts
                </a>

                <a href="#">
                    Reports
                </a>

            </nav>

            <button id="logoutBtn">
                Logout
            </button>

        </aside>


        <!-- Main Content -->

        <main class="main-content">

            <h1>Waste Management</h1>

            <p>Record new biomedical waste</p>


            <div class="form-container">

                <form id="wasteForm">

                    <label for="wasteType">
                        Waste Type
                    </label>

                    <input
                        type="text"
                        id="wasteType"
                        placeholder="Enter waste type"
                        required
                    >


                    <label for="category">
                        Category
                    </label>

                    <select id="category" required>

                        <option value="">
                            Select Category
                        </option>

                    </select>


                    <label for="location">
                        Location
                    </label>

                    <select id="location" required>

                        <option value="">
                            Select Location
                        </option>

                    </select>


                    <label for="quantity">
                        Quantity (kg)
                    </label>

                    <input
                        type="number"
                        id="quantity"
                        placeholder="Enter quantity"
                        min="0.01"
                        step="0.01"
                        required
                    >


                    <button type="submit">
                        Record Waste
                    </button>

                    <p id="message"></p>

                </form>

            </div>

        </main>

    </div>


    <script src="js/waste.js"></script>

</body>

</html>
